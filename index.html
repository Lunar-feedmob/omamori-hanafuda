<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="日本庭院主题的花札记忆配对小游戏：四季八处庭院、四种画风、48 张花札图鉴与朱印成就。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>御守花札</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;900&family=Zen+Old+Mincho:wght@600;900&family=Shippori+Mincho+B1:wght@600;800&family=Yuji+Boku&family=Kaisei+Decol:wght@500;700&family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: one-screen garden. A painted scene (per garden, per look) sits behind everything; the home page is a lantern-lit path through four seasons; the game is HUD / card field / thumb actions.
   Four deliberate single-mode looks, switched with data-look on <html>: kare (moonlit dry garden, default), emaki (gold-cloud screen), washi (paper & ink), cha (tea room). */
:root{
  --bg:#141a24; --panel:rgba(28,36,50,.74); --panel-solid:#1d2534; --line:rgba(232,228,216,.12); --line-2:rgba(232,228,216,.24);
  --text:#ebe6d9; --muted:#aab0bb; --faint:#767e8c; --accent:#e2b65c; --accent-ink:#231a08; --shu:#d0533c; --moss:#93b8a0;
  --back:#22304c; --back-line:rgba(226,182,92,.55); --stone:#5b6577; --stone-2:#454e5f; --unlit:#2a3140; --scrim:rgba(8,11,17,.68);
  --season:#e2b65c; --chip:rgba(255,255,255,.05);
  --f-jp:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif SC",serif;
  --f-head:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --w-jp:900; --w-head:600;
  color-scheme:dark;
}
:root[data-look="emaki"]{
  --bg:#f4efe4; --panel:rgba(255,252,244,.82); --panel-solid:#fbf7ee; --line:rgba(35,38,58,.12); --line-2:rgba(35,38,58,.24);
  --text:#23263a; --muted:#565a6c; --faint:#8a8c97; --accent:#a87a22; --accent-ink:#fffaf0; --shu:#b8381f; --moss:#2f7f6a;
  --back:#a8321f; --back-line:rgba(240,206,120,.75); --stone:#9c9483; --stone-2:#b9b09c; --unlit:#d8cfbc; --scrim:rgba(35,38,58,.42);
  --chip:rgba(35,38,58,.05);
  --f-jp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif SC",serif; --f-head:"Noto Serif SC",serif; --f-body:"Noto Serif SC","Songti SC",serif;
  --w-jp:800; --w-head:900; color-scheme:light;
}
:root[data-look="washi"]{
  --bg:#f1ece0; --panel:rgba(255,253,247,.78); --panel-solid:#faf6ec; --line:rgba(43,42,40,.13); --line-2:rgba(43,42,40,.26);
  --text:#2b2a28; --muted:#5f5b54; --faint:#938e86; --accent:#2b4a6f; --accent-ink:#f6f2e8; --shu:#c23b22; --moss:#55764a;
  --back:#2b4a6f; --back-line:rgba(241,236,224,.6); --stone:#8f8a80; --stone-2:#aaa59b; --unlit:#ddd6c8; --scrim:rgba(43,42,40,.4);
  --chip:rgba(43,42,40,.05);
  --f-jp:"Yuji Boku","Hiragino Mincho ProN","Yu Mincho","Noto Serif SC",serif; --f-head:"ZCOOL XiaoWei","Noto Serif SC",serif; --f-body:"Noto Serif SC","Songti SC",serif;
  --w-jp:400; --w-head:400; color-scheme:light;
}
:root[data-look="cha"]{
  --bg:#2f2a24; --panel:rgba(58,50,41,.82); --panel-solid:#3a3229; --line:rgba(239,230,210,.13); --line-2:rgba(239,230,210,.26);
  --text:#efe6d2; --muted:#c3b597; --faint:#8f846e; --accent:#cdbd85; --accent-ink:#2b261f; --shu:#c0533a; --moss:#9fae74;
  --back:#2b2621; --back-line:rgba(159,174,116,.6); --stone:#6d6253; --stone-2:#564d41; --unlit:#3b342b; --scrim:rgba(20,17,13,.66);
  --chip:rgba(255,255,255,.05);
  --f-jp:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho","Noto Serif SC",serif; --f-head:"Noto Serif SC",serif; --f-body:"Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --w-jp:700; --w-head:600; color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.jp{font-family:var(--f-jp);font-weight:var(--w-jp)}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted)}

#scene{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}
#scene svg{display:block;width:100%;height:100%}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;min-height:0;width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column}

/* ---------- controls ---------- */
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;cursor:pointer;touch-action:manipulation;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.icon-btn{min-height:44px;min-width:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;touch-action:manipulation;font-size:14px;position:relative;white-space:nowrap}
.icon-btn svg{width:20px;height:20px;flex:none}
.icon-btn[aria-pressed="false"]{color:var(--faint)}
.icon-only span{display:none}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--shu);box-shadow:0 0 0 2px var(--panel-solid)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.seg button{min-height:40px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.rail{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .6s}
.flowers{display:inline-flex;gap:2px;vertical-align:middle}
.flowers svg{width:15px;height:15px}

/* ---------- home ---------- */
#home{overflow-y:auto;overscroll-behavior:contain;padding-block:14px 32px;gap:16px}
.h-top{display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0;line-height:1.05}
.brand h1{margin:0;font-family:var(--f-jp);font-weight:var(--w-jp);font-size:clamp(32px,9vw,46px);letter-spacing:.08em}
.brand .kana{display:block;margin-top:6px;font-family:var(--f-jp);font-size:12px;letter-spacing:.42em;color:var(--accent)}
.verse{margin:0;font-family:var(--f-head);font-weight:400;font-size:14px;line-height:1.9;color:var(--muted);letter-spacing:.06em}
.continue{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 12px;text-align:left;cursor:pointer;
  border-radius:18px;border:1px solid var(--season);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 10px 30px -14px var(--season);touch-action:manipulation;transition:transform .12s}
.continue:active{transform:scale(.985)}
.c-art{width:46px;aspect-ratio:61/100;border-radius:5px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.c-art img{display:block;width:100%;height:100%;object-fit:contain}
.c-text{min-width:0;display:grid;gap:2px}
.c-text .eyebrow{color:var(--season)}
.c-text b{font-family:var(--f-jp);font-weight:var(--w-jp);font-size:26px;line-height:1.15;letter-spacing:.06em}
.c-text small{color:var(--muted);font-size:13px}
.c-go{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.haiku{margin:0;display:grid;gap:2px;padding-left:12px;border-left:2px solid var(--season)}
.haiku .jp{font-size:17px;letter-spacing:.12em;line-height:1.6}
.haiku span:nth-child(2){font-family:var(--f-head);font-size:14px;color:var(--muted);letter-spacing:.04em}
.haiku small{font-size:12px;color:var(--faint)}
.seal{display:inline-grid;place-items:center;width:52px;height:52px;border:2.5px solid var(--shu);border-radius:9px;color:var(--shu);background:rgba(194,59,34,.06);
  writing-mode:vertical-rl;font-family:"Zen Old Mincho",serif;font-weight:900;font-size:17px;letter-spacing:.08em;line-height:1;transform:rotate(-5deg)}
.seal.off{border-style:dashed;border-color:var(--line-2);color:var(--faint);background:transparent}
.seals{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 8px}
.seal-cell{display:grid;justify-items:center;gap:6px;text-align:center;font-size:12px;color:var(--muted);line-height:1.4}
.stamp-fx{position:fixed;left:50%;top:44%;z-index:38;pointer-events:none;display:grid;justify-items:center;gap:8px;transform:translate(-50%,-50%)}
.stamp-fx .seal{width:96px;height:96px;font-size:32px;border-width:4px;background:rgba(250,246,236,.92);box-shadow:0 10px 30px rgba(0,0,0,.3);animation:stamp 1.9s ease-out forwards}
.stamp-fx small{padding:3px 12px;border-radius:99px;background:var(--panel-solid);border:1px solid var(--line-2);font-size:13px;color:var(--text);animation:fadeout 1.9s ease-out forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-14deg)}18%{opacity:1;transform:scale(.94) rotate(-5deg)}26%{transform:scale(1) rotate(-5deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-5deg)}}
@keyframes fadeout{0%,15%{opacity:0}25%,80%{opacity:1}100%{opacity:0}}
#board.aura .deck{animation:aura 1.4s ease-out}
@keyframes aura{0%{filter:drop-shadow(0 0 0 transparent)}35%{filter:drop-shadow(0 0 18px var(--season))}100%{filter:drop-shadow(0 0 0 transparent)}}
.mode-note{margin:-8px 0 0;font-size:12px;color:var(--faint);text-align:center}
.collect{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.collect .rail{grid-column:1/-1}
.collect b{font-family:var(--f-head);font-weight:var(--w-head);font-size:16px}
.collect small{display:block;font-size:12px;color:var(--muted)}
.path{position:relative;display:grid;gap:4px;padding-block:6px 4px}
.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.p-season{position:relative;display:grid;gap:4px}
.season-h{display:flex;align-items:center;gap:12px;padding-block:10px 4px}
.s-kanji{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--season);color:var(--season);background:var(--panel);
  font-family:var(--f-jp);font-weight:var(--w-jp);font-size:20px;line-height:1}
.season-h b{display:block;font-family:var(--f-head);font-weight:var(--w-head);font-size:15px}
.season-h small{display:block;font-size:12px;color:var(--muted)}
.stop{position:relative;display:flex;align-items:center;gap:10px;width:min(82%,330px);padding:6px 14px 6px 6px;border-radius:18px;border:1px solid transparent;
  background:transparent;text-align:left;cursor:pointer;touch-action:manipulation}
.stop.right{margin-left:auto;flex-direction:row-reverse;text-align:right;padding:6px 6px 6px 14px}
.stop .lantern{flex:none;width:46px;height:66px}
.stop .lantern svg{display:block;width:100%;height:100%}
.stop .l-roof{fill:var(--stone)} .stop .l-box{fill:var(--stone-2)} .stop .l-win{fill:var(--unlit);transition:fill .4s}
.stop .s-txt{min-width:0;display:grid;gap:1px;padding:8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stop .s-name{font-family:var(--f-jp);font-weight:var(--w-jp);font-size:20px;line-height:1.2;letter-spacing:.05em}
.stop .s-meta{font-size:12px;color:var(--muted)}
.stop.lit .l-win{fill:var(--season)}
.stop.lit .lantern{filter:drop-shadow(0 0 10px var(--season))}
.stop.next .l-win{fill:var(--accent);animation:flicker 2.6s ease-in-out infinite}
.stop.next .lantern{filter:drop-shadow(0 0 14px var(--accent))}
.stop.next .s-txt{border-color:var(--accent)}
.stop:disabled{cursor:default}
.stop:disabled .s-txt{opacity:.55}
@keyframes flicker{0%,100%{opacity:1}45%{opacity:.82}55%{opacity:.95}}
.home-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:12px;color:var(--faint);text-align:center}

/* ---------- game ---------- */
#game{padding-block:8px 10px;gap:8px}
.g-top{display:flex;align-items:center;gap:8px}
.g-title{flex:1;min-width:0;text-align:center;line-height:1.15}
.g-title .eyebrow{display:block;font-size:11px;color:var(--season)}
.g-title b{font-family:var(--f-jp);font-weight:var(--w-jp);font-size:22px;letter-spacing:.08em}
.hud{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}
.stat{padding:7px 12px 8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stat .lab{font-size:12px;color:var(--muted);letter-spacing:.06em}
.stat .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat .val{display:flex;align-items:baseline;gap:4px;font-family:var(--f-head);font-weight:900;line-height:1.1}
.stat .val b{font-size:28px}
.stat .val small{font-size:14px;color:var(--muted);font-weight:600}
.mbar{height:4px;border-radius:99px;background:var(--line);margin-top:5px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .35s}
.stat.low .val b{color:var(--shu)} .stat.low .mbar i{background:var(--shu)}
.hint{align-self:center;min-height:26px;padding:2px 14px;border-radius:99px;background:var(--panel);font-size:13px;color:var(--muted);position:relative;text-align:center}
.hint .tbar{position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:var(--season);transform-origin:left;opacity:0}
.hint .tbar.run{opacity:.9;animation:tbar var(--dur,3s) linear forwards}
@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.combo{color:var(--season);font-weight:700}
#board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow-y:auto;overflow-x:hidden;padding:4px 0}
.deck{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:var(--gap,8px);margin:auto}
.card{--cw:70px;width:var(--cw);aspect-ratio:5/8;padding:0;border:0;background:none;cursor:pointer;perspective:800px;touch-action:manipulation;border-radius:calc(var(--cw)*.08)}
.card .inner{position:relative;display:block;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.25,1);transform-style:preserve-3d}
.card.up .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(var(--cw)*.08);overflow:hidden;
  box-shadow:0 2px 0 rgba(0,0,0,.28),0 7px 16px rgba(0,0,0,.26)}
.face svg{display:block;width:100%;height:100%}
.face img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;user-select:none}
.front{transform:rotateY(180deg);background:#fff}
.stamp{position:absolute;right:5%;bottom:3%;width:38%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-family:"Zen Old Mincho",serif;font-weight:900;font-size:calc(var(--cw)*.19);line-height:1;color:#c23b22;border:1.5px solid #c23b22;
  background:rgba(250,246,236,.92);opacity:0;transform:scale(1.5) rotate(-14deg);transition:opacity .3s,transform .35s}
.card.done{cursor:default}
.card.done .front img{filter:saturate(.72) brightness(.88)}
.card.done .stamp{opacity:1;transform:scale(1) rotate(-14deg)}
.card.pop .inner{animation:pop .5s ease-out}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}40%{transform:rotateY(180deg) scale(1.08)}100%{transform:rotateY(180deg) scale(1)}}
.card.pop .face.front{box-shadow:0 0 0 3px var(--accent),0 0 22px var(--accent)}
.deck.dealing .card{animation:deal .42s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--d,0)*22ms)}
@keyframes deal{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
.g-actions{display:flex;gap:10px}
.g-actions .peek{flex:1}
.pill{min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:rgba(0,0,0,.14);font-size:13px;display:inline-grid;place-items:center}

/* ---------- toast / float ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:35;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:14px;
  background:var(--panel-solid);border:1px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .35s,transform .35s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .t-art{width:30px;aspect-ratio:61/100;border-radius:4px;overflow:hidden;flex:none}
.toast .t-art img{display:block;width:100%;height:100%;object-fit:contain}
.toast .t1{font-size:12px;color:var(--accent);letter-spacing:.08em}
.toast .t2{font-weight:700;line-height:1.3}
.toast .t3{font-size:12px;color:var(--muted)}
.float{position:fixed;z-index:36;width:24px;pointer-events:none;animation:floatUp 1.2s ease-out forwards}
.float svg{display:block;width:100%}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-90%) scale(1)}100%{opacity:0;transform:translate(-50%,-260%) scale(.9)}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--scrim);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.modal-card{width:min(430px,100%);max-height:100%;overflow-y:auto;background:var(--panel-solid);border:1px solid var(--line-2);border-radius:20px;padding:22px 20px 20px;
  box-shadow:0 24px 60px rgba(0,0,0,.4);animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-card h2{margin:4px 0 8px;font-family:var(--f-head);font-weight:900;font-size:24px;letter-spacing:.04em;text-wrap:balance}
.modal-card p{margin:0 0 12px;color:var(--muted)}
.modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.rules{list-style:none;margin:6px 0 12px;padding:0;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.rules .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--line-2);color:var(--accent);font-family:var(--f-head);font-weight:900;font-size:14px}
.rules b{color:var(--text);font-weight:600}
.big-flowers{display:flex;gap:6px;margin:6px 0 12px}
.big-flowers svg{width:34px;height:34px}
.got-row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 4px}
.got{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;text-align:center;font-size:12px;line-height:1.25}
.got .g-art{width:44px;aspect-ratio:61/100;border-radius:5px;overflow:hidden}
.got .g-art img{display:block;width:100%;height:100%;object-fit:contain}
.got span{font-family:var(--f-jp);font-weight:var(--w-jp)}
.credits{margin:6px 0 4px;padding:0;list-style:none;display:grid;gap:10px;font-size:13px;color:var(--muted)}
.credits b{color:var(--text);font-weight:600}
.credits a{color:var(--accent)}

/* ---------- sheets (dex, settings) ---------- */
.sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-family:var(--f-head);font-weight:900;font-size:22px;letter-spacing:.06em}
.sheet-head .count{color:var(--muted);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
.sheet-inner{max-width:900px;margin:0 auto;display:grid;gap:22px}
.intro{padding:16px;border-radius:16px;background:var(--panel-solid);border:1px solid var(--line);display:grid;gap:10px}
.intro h3{margin:0;font-family:var(--f-head);font-weight:var(--w-head);font-size:17px}
.intro p{margin:0;font-size:14px;line-height:1.8;color:var(--muted);max-width:42em}
.intro p b{color:var(--text);font-weight:600}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kind{padding:8px 10px;border-radius:12px;background:var(--chip);border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
.kind b{display:block;font-size:14px;color:var(--text)}
.yaku{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.yk{padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-size:12px;color:var(--muted);line-height:1.5}
.yk b{display:flex;justify-content:space-between;gap:6px;font-size:15px;color:var(--text);font-family:var(--f-jp);font-weight:var(--w-jp)}
.yk b span{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.yk.done{border-color:var(--accent);background:var(--panel)}
.yk.done b span{color:var(--accent)}
.dex-seasons{display:grid;gap:30px}
.dex-seasons .season-h{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:20px 18px}
.month h3{margin:0 0 8px;font-family:var(--f-head);font-weight:var(--w-head);font-size:15px;display:flex;align-items:baseline;gap:8px}
.month h3 .jp{color:var(--accent)}
.month h3 small{color:var(--faint);font-weight:400;font-family:var(--f-body);font-size:12px}
.entries{display:grid;gap:8px}
.entry{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:10px 12px 10px 10px;border-radius:14px;background:var(--panel-solid);border:1px solid var(--line);position:relative}
.e-art{width:60px;aspect-ratio:61/100;border-radius:6px;overflow:hidden;align-self:start}
.e-art svg,.e-art img{display:block;width:100%;height:100%;object-fit:contain}
.e-text{min-width:0}
.e-name{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.e-name b{font-family:var(--f-jp);font-weight:var(--w-jp);font-size:18px;line-height:1.25}
.e-sub{font-size:12px;color:var(--faint)}
.e-mean{margin-top:4px;font-size:13px;color:var(--text)}
.e-mean span{color:var(--accent);margin-right:6px;font-size:12px}
.e-text p{margin:2px 0 6px;font-size:13px;line-height:1.7;color:var(--muted)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.tag.hikari{border-color:var(--accent);color:var(--accent)}
.tag.tane{border-color:var(--moss);color:var(--moss)}
.tag.tan{border-color:var(--shu);color:var(--shu)}
.e-om{display:flex;align-items:center;gap:6px;font-size:12px}
.e-om svg{width:14px;height:20px;flex:none}
.e-om .cnt{color:var(--muted)}
.entry.locked .e-text,.entry.locked .e-name b{color:var(--faint)}
.new-badge{position:absolute;top:8px;right:10px;font-size:11px;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:0 7px;font-weight:700}
.set-group{display:grid;gap:10px}
.set-group h3{margin:0;font-family:var(--f-head);font-weight:var(--w-head);font-size:16px}
.set-group > p{margin:-4px 0 0;font-size:12px;color:var(--faint)}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.look{display:grid;grid-template-rows:auto auto;gap:0;padding:0;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--panel-solid);cursor:pointer;text-align:left}
.look[aria-checked="true"]{border-color:var(--accent)}
.look .sw{height:84px;position:relative}
.look .sw svg{display:block;width:100%;height:100%}
.look .lt{padding:8px 12px 10px;display:grid;gap:2px}
.look .lt b{font-size:15px}
.look .lt small{font-size:12px;color:var(--muted);line-height:1.6}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skin{display:grid;justify-items:center;gap:6px;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:var(--panel-solid);cursor:pointer;font-size:13px}
.skin[aria-checked="true"]{border-color:var(--accent)}
.skin .mini{display:flex;gap:3px}
.skin .mini img{width:30px;aspect-ratio:61/100;object-fit:contain;border-radius:3px}
.skin small{font-size:11px;color:var(--muted)}
.toggles{display:grid;gap:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel-solid);cursor:pointer;text-align:left}
.toggle small{display:block;font-size:12px;color:var(--muted)}
.toggle .sw2{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;transition:background .2s}
.toggle .sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--panel-solid);transition:transform .2s}
.toggle[aria-checked="true"] .sw2{background:var(--accent)}
.toggle[aria-checked="true"] .sw2::after{transform:translateX(18px)}
.toggle:disabled{opacity:.45;cursor:default}
.links{display:flex;flex-wrap:wrap;gap:8px}
.save-note{font-size:12px;color:var(--faint)}

@media (min-width:720px){ .stat .val b{font-size:32px} }
@media (max-height:640px){ .stat{padding:5px 10px 6px} .stat .val b{font-size:24px} .btn{min-height:46px} }
@media (prefers-reduced-motion:reduce){
  .card .inner{transition:none}
  .deck.dealing .card,.card.pop .inner,.modal-card,.float,.stop.next .l-win,#board.aura .deck{animation:none}
  .stamp-fx .seal,.stamp-fx small{animation-duration:.01s;animation-delay:1.6s}
  .toast,.rail i,.mbar i{transition:none}
}
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<canvas id="petals" aria-hidden="true"></canvas>
<div id="app">
  <section id="home" class="screen" aria-label="庭院">
    <header class="h-top">
      <div class="brand"><h1>御守花札</h1><span class="kana">おまもり　はなふだ</span></div>
      <button class="icon-btn" id="btnDexHome" type="button" aria-label="打开图鉴">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 4.5h5.5a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 0-1.5-1.5H3zM17 4.5h-5.5A1.5 1.5 0 0 0 10 6v10a1.5 1.5 0 0 1 1.5-1.5H17z"/></svg>
        <span class="tnum" id="dexMiniHome">0/48</span><span class="dot" id="dotHome" hidden></span>
      </button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="设置">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 6h9M15 6h2M3 14h2M8 14h9"/><circle cx="13.5" cy="6" r="1.8"/><circle cx="6.5" cy="14" r="1.8"/></svg>
      </button>
    </header>
    <p class="haiku" id="haiku"></p>
    <button class="continue" id="btnContinue" type="button">
      <span class="c-art" id="cArt"></span>
      <span class="c-text"><span class="eyebrow" id="cEyebrow">继续</span><b id="cName">初音</b><small id="cMeta"></small></span>
      <span class="c-go" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M6 4l10 6-10 6z"/></svg></span>
    </button>
    <div class="seg" id="modeSeg" role="radiogroup" aria-label="难度"></div>
    <p class="mode-note" id="modeNote"></p>
    <button class="collect" id="btnDexStrip" type="button" style="text-align:left;cursor:pointer;color:inherit">
      <span><b>图鉴与朱印帖</b><small id="homeCount">花札 0 / 48 · 御守 0 枚</small></span>
      <span class="eyebrow">打开 ›</span>
      <span class="rail"><i id="homeRail" style="width:0%"></i></span>
    </button>
    <div class="path" id="path"></div>
    <div class="home-foot"><span id="saveNote">收集进度保存在这台设备的浏览器里，刷新页面不会丢失。</span></div>
  </section>

  <section id="game" class="screen" aria-label="对局" hidden>
    <div class="g-top">
      <button class="icon-btn" id="btnHome" type="button" aria-label="返回庭院">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"/></svg>庭院
      </button>
      <div class="g-title"><span class="eyebrow" id="gNum">春 · 第一庭</span><b id="gName">初音</b></div>
      <button class="icon-btn" id="btnDexGame" type="button" aria-label="打开图鉴">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 4.5h5.5a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 0-1.5-1.5H3zM17 4.5h-5.5A1.5 1.5 0 0 0 10 6v10a1.5 1.5 0 0 1 1.5-1.5H17z"/></svg>
        <span class="tnum" id="dexMini">0/48</span><span class="dot" id="dotGame" hidden></span>
      </button>
      <button class="icon-btn sound-btn icon-only" type="button" aria-pressed="true"></button>
    </div>
    <div class="hud">
      <div class="stat" id="statMoves">
        <div class="top"><span class="lab" id="movesLab">剩余步数</span><span class="lab tnum" id="usedMoves">已用 0</span></div>
        <div class="val tnum"><b id="movesLeft">11</b><small id="movesTotal">/ 11</small></div>
        <div class="mbar" id="movesRail"><i id="movesBar" style="width:100%"></i></div>
      </div>
      <div class="stat">
        <div class="top"><span class="lab">已配对</span><span class="lab" id="comboLab"></span></div>
        <div class="val tnum"><b id="pairsDone">0</b><small id="pairsTotal">/ 4 组</small></div>
      </div>
    </div>
    <div class="hint" id="hint" aria-live="polite"><span id="hintText">记住花札的位置</span><span class="tbar" id="tbar"></span></div>
    <div id="board"><div class="deck" id="deck"></div></div>
    <div class="g-actions">
      <button class="btn primary peek" id="btnPeek" type="button">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.8 10S5 4.5 10 4.5 18.2 10 18.2 10 15 15.5 10 15.5 1.8 10 1.8 10z"/><circle cx="10" cy="10" r="2.6"/></svg>
        重新看牌 <span class="pill tnum" id="peekLeft">1</span>
      </button>
      <button class="btn" id="btnRestart" type="button">重来</button>
    </div>
  </section>
</div>

<div class="sheet" id="dex" role="dialog" aria-modal="true" aria-labelledby="dexTitle" hidden>
  <div class="sheet-head">
    <h2 id="dexTitle">花札图鉴</h2>
    <span class="count tnum" id="dexCount">0 / 48 张</span>
    <button class="btn" id="dexClose" type="button">关闭</button>
  </div>
  <div class="sheet-body"><div class="sheet-inner">
    <div class="rail"><i id="dexRail" style="width:0%"></i></div>
    <section class="intro" id="dexIntro"></section>
    <div class="dex-seasons" id="months"></div>
  </div></div>
</div>

<div class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden>
  <div class="sheet-head">
    <h2 id="setTitle">设置</h2><span class="count"></span>
    <button class="btn" id="setClose" type="button">完成</button>
  </div>
  <div class="sheet-body"><div class="sheet-inner">
    <section class="set-group"><h3>庭院主题</h3><p>配色、字体和每处庭院的背景画法都会随之改变。</p><div class="looks" id="looks" role="radiogroup" aria-label="庭院主题"></div></section>
    <section class="set-group"><h3>卡面</h3><p>三套都出自 Louie Mantia（墨染、朱缘另有すけじょ参与），配色与边框各不相同。</p><div class="skins" id="skins" role="radiogroup" aria-label="卡面"></div></section>
    <section class="set-group"><h3>难度</h3><div class="seg" id="modeSeg2" role="radiogroup" aria-label="难度"></div><p id="modeNote2"></p></section>
    <section class="set-group"><h3>声音</h3><div class="toggles">
      <button class="toggle" id="tgSound" type="button" role="switch"><span><b>音效</b><small>翻牌、配对与通关的声音</small></span><span class="sw2"></span></button>
      <button class="toggle" id="tgBgm" type="button" role="switch"><span><b>背景琴声</b><small>按季节换乐器：春琴、夏风铃、秋尺八、冬钵铃</small></span><span class="sw2"></span></button>
      <button class="toggle" id="tgAmb" type="button" role="switch"><span><b>庭院环境音</b><small>流水、鹿威し，以及黄莺、风铃、铃虫或寺钟</small></span><span class="sw2"></span></button>
    </div></section>
    <section class="set-group"><h3>其他</h3><div class="links">
      <button class="btn" id="btnRules" type="button">游玩说明</button>
      <button class="btn" id="btnCredits" type="button">素材致谢</button>
    </div><p class="save-note" id="saveNote2"></p></section>
  </div></div>
</div>

<div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" id="modalCard"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const $ = s => document.querySelector(s);
const r2 = n => Math.round(n * 100) / 100;
const rad = d => d * Math.PI / 180;

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

function mergeBest(src, into) {
  for (const k in src) { const v = Number(src[k]); if (v > 0 && LEVELS[k - 1]) into[k] = Math.max(into[k] || 0, Math.min(3, v)); }
}
function mergeProgress(d, withPrefs) {
  const n = Number(d.unlocked);
  if (n >= 1) save.unlocked = Math.min(LEVELS.length, Math.max(save.unlocked, Math.floor(n)));
  if (d.best && typeof d.best === 'object') {
    if (d.best.relax || d.best.std || d.best.hard) { for (const m in MODES) if (d.best[m] && typeof d.best[m] === 'object') mergeBest(d.best[m], save.best[m]); }
    else mergeBest(d.best, save.best.hard);   // saves from the first version used today's challenge numbers
  }
  if (d.collected && typeof d.collected === 'object') for (const k in d.collected) { const v = Number(d.collected[k]); if (BY_ID[k] && v > 0) save.collected[k] = Math.max(save.collected[k] || 0, Math.floor(v)); }
  if (d.seals && typeof d.seals === 'object') for (const k in d.seals) if (SEALS.some(x => x.id === k) && Number(d.seals[k]) > 0) save.seals[k] = save.seals[k] || Number(d.seals[k]);
  if (withPrefs) {
    if (Array.isArray(d.unseen)) save.unseen = d.unseen.filter(id => BY_ID[id]);
    for (const k of ['sound', 'ambience', 'bgm', 'seenRules']) if (typeof d[k] === 'boolean') save[k] = d[k];
    if (MODES[d.mode]) save.mode = d.mode;
    if (LOOKS[d.look]) save.look = d.look;
    if (SKINS[d.skin]) save.skin = d.skin;
  }
}

let cloud = null, cloudTimer = 0, cloudBusy = false, cloudDirty = false;
function cloudQueue() { if (!cloud) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudWrite, 700); }
async function cloudWrite() {
  if (!cloud) return;
  if (cloudBusy) { cloudDirty = true; return; }
  cloudBusy = true; cloudDirty = false;
  try {
    await cloud.set({unlocked: save.unlocked, best: JSON.parse(JSON.stringify(save.best)), collected: {...save.collected}, seals: {...save.seals}, updatedAt: Date.now()});
  } catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { cloud = null; setSaveNote(); }
  }
  cloudBusy = false;
  if (cloudDirty) cloudQueue();
}
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/save');
    const snap = await ref.get();
    if (snap.exists) { mergeProgress(snap.data() || {}, false); try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} refreshMeta(); }
    cloud = ref; setSaveNote(); cloudQueue();
  } catch (e) {}
}

  for (const id of tiers.flatMap(f => shuffle(MOTIFS.filter(f).map(m => m.id)))) {
    const m = BY_ID[id];

    per[m.m] = (per[m.m] || 0) + 1; if (m.tag === '素札') kasu[m.m] = 1;

  deck.style.setProperty('--gap', gap + 'px');
  deck.style.width = (cols * w + (cols - 1) * gap) + 'px';
  for (const el of deck.children) el.style.setProperty('--cw', w + 'px');
}

/* ================= seasonal particles ================= */
const FX = (() => {
  const cv = $('#petals'), cx = cv.getContext && cv.getContext('2d');
  if (!cx) return {set() {}, recolor() {}};
  let W = 0, H = 0, raf = 0, kind = 'spring', P2 = [];
  const still = reduceMotion(), pick = a => a[Math.floor(Math.random() * a.length)];
  const COUNT = {spring: 16, summer: 16, autumn: 12, winter: 46};
  const light = () => LOOKS[save.look].light;
  function spawn(k, top) {
    const p = {x: Math.random(), y: top ? -.05 : Math.random(), ph: Math.random() * 6.3, r: Math.random() * 6.3, vr: 0};
    if (k === 'spring') return Object.assign(p, {s: 3 + Math.random() * 3.5, vy: .0003 + Math.random() * .0003, vx: .00012 + Math.random() * .0002, vr: (Math.random() - .5) * .03,
      c: pick(['rgba(240,170,188,.75)', 'rgba(232,150,172,.62)', 'rgba(250,214,222,.6)'])});
    if (k === 'summer') return Object.assign(p, {y: .3 + Math.random() * .7, s: 1.6 + Math.random() * 1.3, vx: (Math.random() - .5) * .0004, vy: (Math.random() - .5) * .0003});
    if (k === 'autumn') return Object.assign(p, {s: 5 + Math.random() * 4, vy: .0004 + Math.random() * .0004, vx: (Math.random() - .4) * .0003, vr: (Math.random() - .5) * .04,
      c: pick(['rgba(214,82,48,.78)', 'rgba(232,140,60,.72)', 'rgba(190,60,40,.72)', 'rgba(226,170,70,.66)'])});
    return Object.assign(p, {s: 1.1 + Math.random() * 2.2, vy: .00025 + Math.random() * .0004, vx: (Math.random() - .5) * .0001, a: .4 + Math.random() * .45});
  }
  function leaf(s) { cx.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? s * .45 : s, a = -Math.PI / 2 + i * Math.PI / 5; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } cx.closePath(); }
  function draw(step) {
    cx.clearRect(0, 0, W, H);
    const lt = light();
    for (let i = 0; i < P2.length; i++) {
      let p = P2[i];
      if (step) {
        p.ph += .012;
        if (kind === 'summer') { p.x += p.vx + Math.sin(p.ph) * .0003; p.y += p.vy + Math.cos(p.ph * .8) * .0003; if (p.x < -.05 || p.x > 1.05 || p.y < .2 || p.y > 1.05) P2[i] = p = spawn(kind, false); }
        else { p.y += p.vy; p.x += p.vx + Math.sin(p.ph) * (kind === 'winter' ? .0004 : .0003); p.r += p.vr; if (p.y > 1.05 || p.x > 1.08 || p.x < -.08) P2[i] = p = spawn(kind, true); }
      }
      cx.save(); cx.translate(p.x * W, p.y * H);
      if (kind === 'summer') {
        cx.globalAlpha = .15 + .85 * Math.max(0, Math.sin(p.ph * 2.2 + p.r));
        cx.fillStyle = lt ? 'rgba(170,150,40,.18)' : 'rgba(205,235,120,.16)'; cx.beginPath(); cx.arc(0, 0, p.s * 4.5, 0, 6.3); cx.fill();
        cx.fillStyle = lt ? 'rgba(160,130,20,.9)' : 'rgba(228,248,150,.95)'; cx.beginPath(); cx.arc(0, 0, p.s, 0, 6.3); cx.fill();
      } else if (kind === 'winter') {
        cx.fillStyle = lt ? `rgba(120,140,170,${p.a})` : `rgba(240,245,255,${p.a})`; cx.beginPath(); cx.arc(0, 0, p.s, 0, 6.3); cx.fill();
      } else {
        cx.rotate(p.r); cx.fillStyle = p.c;
        if (kind === 'autumn') { leaf(p.s); cx.fill(); } else { cx.beginPath(); cx.ellipse(0, 0, p.s, p.s * .55, 0, 0, 6.3); cx.fill(); }
      }
      cx.restore();
    }
  }
  function size() { const dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); if (still) draw(false); }
  function loop() { draw(true); raf = requestAnimationFrame(loop); }
  size(); window.addEventListener('resize', size);
  if (!still) { loop(); document.addEventListener('visibilitychange', () => { cancelAnimationFrame(raf); if (!document.hidden) loop(); }); }
  return {set(k) { kind = k; P2 = Array.from({length: COUNT[k]}, () => spawn(k, false)); if (still) draw(false); }, recolor() { if (still) draw(false); }};
})();

/* ================= events ================= */
$('#deck').addEventListener('click', e => { const b = e.target.closest('.card'); if (b) tap(+b.dataset.i); });
$('#path').addEventListener('click', e => { const b = e.target.closest('.stop'); if (b && !b.disabled) { SFX.tap(); requestLevel(+b.dataset.n); } });
$('#btnContinue').addEventListener('click', e => { SFX.tap(); requestLevel(+e.currentTarget.dataset.n); });
$('#btnPeek').addEventListener('click', peek);
$('#btnRestart').addEventListener('click', () => { if (G) { SFX.tap(); startLevel(G.n, true); } });
$('#btnHome').addEventListener('click', () => { SFX.tap(); goHome(); });
['#btnDexHome', '#btnDexGame', '#btnDexStrip'].forEach(id => $(id).addEventListener('click', () => { SFX.tap(); openSheet('dex', renderDex); }));
$('#dexClose').addEventListener('click', () => closeSheet('dex'));
$('#btnSettings').addEventListener('click', () => { SFX.tap(); openSheet('settings', renderSettings); });
$('#setClose').addEventListener('click', () => closeSheet('settings'));
$('#btnRules').addEventListener('click', () => openModal(rulesHTML('知道了')));
$('#btnCredits').addEventListener('click', () => openModal(creditsHTML()));
document.querySelectorAll('.sound-btn').forEach(b => b.addEventListener('click', () => setSound(!save.sound)));
const onMode = e => { const b = e.target.closest('[data-mode]'); if (!b) return; save.mode = b.dataset.mode; persist(); SFX.tap(); renderModes(); if (current === 'home') renderHome(); };
$('#modeSeg').addEventListener('click', onMode); $('#modeSeg2').addEventListener('click', onMode);
$('#looks').addEventListener('click', e => { const b = e.target.closest('[data-look]'); if (!b) return; save.look = b.dataset.look; persist(); SFX.tap(); applyLook(); renderSettings(); });
$('#skins').addEventListener('click', e => { const b = e.target.closest('[data-skin]'); if (!b) return; save.skin = b.dataset.skin; persist(); SFX.tap(); renderSettings(); renderHome(); });
$('#tgSound').addEventListener('click', () => setSound(!save.sound));
$('#tgBgm').addEventListener('click', () => { save.bgm = !save.bgm; persist(); renderSoundUI(); startAudio(); });
$('#tgAmb').addEventListener('click', () => { save.ambience = !save.ambience; persist(); startAudio().then(() => { applyAmbience(); renderSoundUI(); }); });
$('#modalCard').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, n = G ? G.n : 1;
  SFX.tap();
  if (act === 'close') return closeModal(true);
  closeModal(false);
  if (act === 'next') requestLevel(n + 1);
  else if (act === 'replay') startLevel(n, false);
  else if (act === 'retry') startLevel(n, true);
  else if (act === 'home') goHome();
  else if (act === 'dex') { goHome(); openSheet('dex', renderDex); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#modal').hidden && $('#modalCard [data-act="close"]')) closeModal(true);
  else if (!$('#dex').hidden) closeSheet('dex');
  else if (!$('#settings').hidden) closeSheet('settings');
});
const unlockAudio = () => { startAudio(); audio(); };
document.addEventListener('pointerdown', unlockAudio, {once: true});
document.addEventListener('keydown', unlockAudio, {once: true});
if ('ResizeObserver' in window) { new ResizeObserver(() => layoutBoard()).observe($('#board')); new ResizeObserver(() => drawTrail()).observe($('#path')); }
else window.addEventListener('resize', () => { layoutBoard(); drawTrail(); });

/* ================= boot ================= */
document.documentElement.dataset.look = save.look;
renderModes(); renderSoundUI(); setSaveNote(); refreshMeta();
initCloud();
function start(data) {
  const n = data && Number(data.level);
  if (data && data.screen === 'game' && n >= 1 && n <= save.unlocked) startLevel(n, false); else show('home');
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({screen: current, level: G ? G.n : null}));
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>

</body>
